name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: backend/go.mod }
      - run: go vet ./...
      - run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - run: go test ./... -race -coverprofile=coverage.out
      - run: go tool cover -func=coverage.out

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: docker build -t calculator .
      - name: Start production container
        run: docker run -d --name calculator-ci -p 127.0.0.1:18080:8080 calculator
      - name: Wait for health
        run: curl --fail --silent --show-error --retry 30 --retry-connrefused --retry-delay 1 --max-time 3 http://127.0.0.1:18080/healthz | jq -e '.status == "ok"'
      - name: Verify API contract
        run: bash qa/api_contract_test.sh http://127.0.0.1:18080
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Browser regression tests against production container
        run: npm run test:e2e
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:18080
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
      - name: Container logs
        if: always()
        run: docker logs calculator-ci
      - name: Stop container
        if: always()
        run: docker rm -f calculator-ci
